name: Unit and committable-scope full Windows feedback

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-check:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 2
          lfs: false
      - name: Install the repository SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify Unit checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne $env:GITHUB_SHA) { throw 'Unit checkout does not match GITHUB_SHA.' }
      - name: Show selected SDK
        shell: pwsh
        run: dotnet --version
      - name: Run Core Unit
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP/unit-results/core") { throw 'Core Unit results directory already exists.' }
          dotnet test tests/Pal.Core.UnitTests/Pal.Core.UnitTests.csproj --configuration Debug --settings tests/unit.runsettings --logger 'trx;LogFileName=results.trx' --results-directory "$env:RUNNER_TEMP/unit-results/core"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/unit-results/core/results.trx" -PathType Leaf)) { throw 'Missing current Core Unit TRX.' }
      - name: Run CLI Unit
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP/unit-results/cli-unit") { throw 'CLI Unit results directory already exists.' }
          dotnet test tests/Pal.Extract.UnitTests/Pal.Extract.UnitTests.csproj --configuration Debug --settings tests/unit.runsettings --logger 'trx;LogFileName=results.trx' --results-directory "$env:RUNNER_TEMP/unit-results/cli-unit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath "$env:RUNNER_TEMP/unit-results/cli-unit/results.trx" -PathType Leaf)) { throw 'Missing current CLI Unit TRX.' }
      - name: Upload Unit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ci-unit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/unit-results/core/results.trx
            ${{ runner.temp }}/unit-results/cli-unit/results.trx

  full-check:
    # #76 informational committable-scope full gate: the real Test-M0 entry on the
    # committable subset (private staged real-asset positives stay on local receipts;
    # see docs/testing/engineering-checks.md). Heavy by design: only main pushes, explicit
    # PR readiness and manual dispatch start it, never per-synchronize. Not a required
    # check; converting it to required is a maintainer operation documented there.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review')
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact event candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 2
          lfs: false
      - name: Install the repository SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify full gate checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne $env:GITHUB_SHA) { throw 'Full gate checkout does not match GITHUB_SHA.' }
      - name: Committable-scope full gate (Test-M0)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Get-Godot.ps1') -Destination (Join-Path $env:RUNNER_TEMP 'godot')
          $evidence = Join-Path $env:RUNNER_TEMP 'm0-evidence'
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/Test-M0.ps1') -GodotPath $godot -EvidenceDirectory $evidence -Scope committable
          Get-Content -LiteralPath (Join-Path $evidence 'PASS.txt')
      - name: Upload full gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ci-full-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/m0-evidence/PASS.txt
            ${{ runner.temp }}/m0-evidence/test-results.json
            ${{ runner.temp }}/m0-evidence/game-batch-plan.json
            ${{ runner.temp }}/m0-evidence/game-batches.json
            ${{ runner.temp }}/m0-evidence/discovery.json
            ${{ runner.temp }}/m0-evidence/discovery.log
            ${{ runner.temp }}/m0-evidence/processes-*.json
            ${{ runner.temp }}/m0-evidence/**/*.trx
            ${{ runner.temp }}/m0-evidence/godot/**
