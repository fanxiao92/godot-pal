name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 2
          lfs: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Run pal.ps1 ci dotnet
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./pal.ps1 ci dotnet --out "${{ runner.temp }}/pal-ci-dotnet"
      - name: Upload dotnet artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ci-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pal-ci-dotnet/run-summary.json
            ${{ runner.temp }}/pal-ci-dotnet/summary.md
            ${{ runner.temp }}/pal-ci-dotnet/trx/**
            ${{ runner.temp }}/pal-ci-dotnet/junit/**
            ${{ runner.temp }}/pal-ci-dotnet/coverage/**

  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 2
          lfs: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install pinned Godot
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./pal.ps1 godot install --destination "${{ runner.temp }}/godot" --out "${{ runner.temp }}/pal-godot-install"
      - name: Warm Godot import cache
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./pal.ps1 godot import --out "${{ runner.temp }}/pal-godot-import"
      - name: Run pal.ps1 ci prepare
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./pal.ps1 ci prepare --out "${{ runner.temp }}/pal-ci-prepare"
      - name: Upload prepare artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ci-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pal-ci-prepare/run-summary.json
            ${{ runner.temp }}/pal-ci-prepare/summary.md
            ${{ runner.temp }}/pal-ci-prepare/trx/**
            ${{ runner.temp }}/pal-ci-prepare/junit/**

  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 2
          lfs: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Install pinned Godot
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./pal.ps1 godot install --destination "${{ runner.temp }}/godot" --out "${{ runner.temp }}/pal-godot-install"
      - name: Warm Godot import cache
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./pal.ps1 godot import --out "${{ runner.temp }}/pal-godot-import"
      - name: Run pal.ps1 ci game
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File ./pal.ps1 ci game --out "${{ runner.temp }}/pal-ci-game"
      - name: Upload game artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: ci-game-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pal-ci-game/run-summary.json
            ${{ runner.temp }}/pal-ci-game/summary.md
            ${{ runner.temp }}/pal-ci-game/trx/**
            ${{ runner.temp }}/pal-ci-game/junit/**
