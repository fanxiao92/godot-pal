name: M0, M2 and M3 Windows acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          # Only synthetic M1 inputs are generated locally; no original game data is downloaded.
          lfs: false
      - name: Install the repository SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Download and verify official Godot .NET
        shell: pwsh
        run: |
          $godot = ./scripts/Get-Godot.ps1 -Destination "$env:RUNNER_TEMP/godot-4.7.2"
          "GODOT_CONSOLE=$godot" >> $env:GITHUB_ENV
      - name: Run shared M0, M2 and M3 acceptance checks
        shell: pwsh
        run: |
          ./scripts/Test-M0.ps1 -GodotPath $env:GODOT_CONSOLE -EvidenceDirectory "$env:RUNNER_TEMP/m0-evidence"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: m0-windows-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/m0-evidence/acceptance.log
            ${{ runner.temp }}/m0-evidence/PASS.txt
            ${{ runner.temp }}/m0-evidence/*.log
            ${{ runner.temp }}/m0-evidence/*.json
            ${{ runner.temp }}/m0-evidence/solution/*.trx
            ${{ runner.temp }}/m0-evidence/game/*.trx
            ${{ runner.temp }}/m0-evidence/game-repeat/*.trx
            ${{ runner.temp }}/m0-evidence/IntentionalAssertionMismatch/*.trx
            ${{ runner.temp }}/m0-evidence/IntentionalTimeout/*.trx
            ${{ runner.temp }}/m0-evidence/NativeReadyException/*.trx
            ${{ runner.temp }}/m0-evidence/godot/*.log
            ${{ runner.temp }}/m0-evidence/godot/*.json
